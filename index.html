<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  
  <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="shortcut icon" href="favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="apple-mobile-web-app-title" content="Dopamine Runner" />

  <title>Dopamine Runner: RPG 🛡️</title>
  
  <style>
    @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css");

    :root{ --bg:#fde2ff; --ink:#2a2a2a; --accent: #6200ea; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body{ 
      margin:0; height: 100dvh; 
      display:flex; justify-content: center; align-items: center;
      font-family: "Pretendard", sans-serif; 
      color:var(--ink); overflow:hidden; touch-action: none; 
      user-select: none; -webkit-user-select: none;
      
      background-color: var(--bg);
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      transition: background-image 0.5s ease-in-out; 
    }

    /* 배경 이미지 */
    body.bg-pink { background-image: url('bg_pink.png') !important; color: #333; }
    body.bg-sky { background-image: url('bg_sky.png') !important; color: #333; }
    body.bg-green { background-image: url('bg_green.png') !important; color: #333; }
    body.sunset { background-image: url('bg_sunset.png') !important; color: white !important; }
    body.night { background-image: url('bg_midnight.png') !important; color: white !important; }
    body.space { background-image: url('bg_space.png') !important; color: white !important; }
    body.aurora { background-image: url('bg_aurora.png') !important; color: white !important; }
    
    body.fever-mode { position: relative; color: white !important; }
    body.fever-mode::before {
        content: ""; position: absolute; inset: 0;
        background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
        background-size: 400%; animation: rainbowBg 0.5s linear infinite;
        opacity: 0.5; z-index: -1;
    }
    @keyframes rainbowBg { 0% {background-position: 0%;} 100% {background-position: 400%;} }

    .app{ width: 100%; height: 100%; position:relative; display: flex; flex-direction: column; }
    
    /* 상단 UI (Clean Ver) */
    .top-container { 
        position: absolute; top: 0; left: 0; right: 0; padding: 15px; 
        z-index: 20; display: flex; justify-content: space-between; align-items: flex-start;
        pointer-events: none; 
    }
    
    .coin-badge { 
        background: #FFD700; color: #333; padding: 8px 14px; border-radius: 20px; 
        font-size: 14px; font-weight: 800; box-shadow: 0 4px 6px rgba(0,0,0,0.2); 
        display: flex; align-items: center; gap: 5px; white-space: nowrap; border: 2px solid white; pointer-events: auto;
    }

    .score-board {
        background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(8px);
        padding: 8px 14px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        display: flex; flex-direction: column; justify-content: center; min-width: 90px;
        border: 1px solid rgba(255, 255, 255, 0.4); pointer-events: auto;
    }
    .score-row { font-size: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; line-height: 1.3; }
    .score-row span:first-child { opacity: 0.8; font-size: 11px; font-weight: bold; }
    .score-val { font-weight: 900; color: #333; font-size: 15px; text-shadow: 0 0 2px rgba(255,255,255,0.8); }

    .fever-bar-bg { 
        position: absolute; top: 100px; left: 20px; right: 20px; 
        height: 8px; background: rgba(0,0,0,0.2); border-radius: 10px; overflow: hidden; 
        border: 2px solid rgba(255,255,255,0.5); z-index: 15; pointer-events: none;
    }
    .fever-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #fbc02d, #ffeb3b); transition: width 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); box-shadow: 0 0 10px #ffeb3b; }
    .fever-bar-fill.full { background: linear-gradient(90deg, #ff0000, #ffff00); animation: pulseBar 0.2s infinite; }
    @keyframes pulseBar { 0%{opacity:1;} 50%{opacity:0.7;} 100%{opacity:1;} }

    .stage{ position:relative; flex-grow: 1; width: 100%; border-radius: var(--round); box-shadow: var(--shadow); background: transparent; overflow:hidden; user-select:none; cursor: pointer; transform: translateZ(0); }
    .stage.shake { animation: shakeAnim 0.5s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes shakeAnim { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }

    .ground{ 
        position: absolute; bottom:0; width: 100%; height: var(--ground-height); 
        background: rgba(255,255,255,0.3); border-top: 2px solid rgba(255,255,255,0.5); backdrop-filter: blur(2px);
    }

    .player { position: absolute; left: 50px; bottom: var(--ground-height); width: 90px; height: 90px; z-index: 10; transform-origin: center; display:flex; align-items:center; justify-content:center; font-size: 60px; transition: bottom 0.1s linear; }
    .player img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; filter: drop-shadow(0 4px 2px rgba(0,0,0,0.2)); }
    .player.giant { transform: scale(1.5); filter: drop-shadow(0 0 15px gold); }
    
    /* 🛡️ 방어막 이펙트 */
    .shield-effect {
        position: absolute; width: 120%; height: 120%;
        border: 4px solid #00d2ff; border-radius: 50%;
        background: rgba(0, 210, 255, 0.2);
        box-shadow: 0 0 15px #00d2ff;
        animation: shieldPulse 1s infinite alternate;
        pointer-events: none;
    }
    @keyframes shieldPulse { from { opacity: 0.6; transform: scale(0.95); } to { opacity: 1; transform: scale(1.05); } }

    @keyframes runWobble { 0% { transform: rotate(-3deg) translateY(0); } 25% { transform: rotate(0deg) translateY(-2px); } 50% { transform: rotate(3deg) translateY(0); } 75% { transform: rotate(0deg) translateY(-2px); } 100% { transform: rotate(-3deg) translateY(0); } }
    .player.running img, .player.running.emoji-char { animation: runWobble 0.3s infinite linear; }
    .spin img, .spin.emoji-char { animation: spinPlayer 0.5s ease-in-out; }
    @keyframes spinPlayer { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .player.dead { animation: knockback 0.8s forwards ease-out; }
    @keyframes knockback { 0% { transform: scale(1) rotate(0deg); opacity: 1; } 100% { transform: scale(0.8) rotate(720deg) translate(200px, -200px); opacity: 0; } }

    .trail { position: absolute; width: 90px; height: 90px; opacity: 0.6; pointer-events: none; z-index: 5; filter: grayscale(1) blur(1px); display:flex; align-items:center; justify-content:center; font-size: 60px;}
    .trail img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }

    .dust { position: absolute; width: 30px; height: 15px; background: rgba(255, 255, 255, 0.7); border-radius: 50%; z-index: 5; animation: dustAnim 0.4s forwards; }
    @keyframes dustAnim { 0% { transform: scale(0.5); opacity: 0.8; } 100% { transform: scale(1.5) translateY(-10px); opacity: 0; } }
    .float-text { position: absolute; font-weight: 900; color: #ffeb3b; font-size: 24px; z-index: 50; pointer-events: none; text-shadow: 2px 2px 0 #000; animation: floatUp 0.8s forwards; }
    @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-60px) scale(1.2); opacity: 0; } }

    .obstacle{ position:absolute; width:50px; height:50px; font-size:40px; display:flex; align-items:center; justify-content:center; }
    .obstacle.bird { animation: fly 0.6s infinite alternate ease-in-out; font-size: 45px; }
    @keyframes fly { from { transform: translateY(0); } to { transform: translateY(-10px); } }
    .obstacle.high-danger { filter: hue-rotate(270deg); font-size: 50px; }
    .obstacle.tall { font-size: 70px; height: 90px; align-items: flex-end; }
    body.night .obstacle, body.space .obstacle, body.aurora .obstacle, body.sunset .obstacle { filter: brightness(1.2); text-shadow: 0 0 10px rgba(255,255,255,0.5); }
    .obstacle.smashed { transition: none; animation: smashAnim 0.5s forwards ease-out; z-index: 20; }
    @keyframes smashAnim { 0% { transform: scale(1); } 30% { transform: scale(1.3) rotate(45deg); filter: brightness(5); } 100% { transform: scale(0) rotate(180deg) translate(50px, -150px); opacity: 0; } }

    .item-star { position: absolute; width: 40px; height: 40px; font-size: 35px; display: flex; align-items: center; justify-content: center; z-index: 9; animation: spinStar 2s infinite linear; }
    @keyframes spinStar { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .milestone-text { position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%); font-size: 50px; font-weight: bold; color: #FFD700; text-shadow: 2px 2px 0 #000; pointer-events: none; z-index: 50; animation: popFade 1.5s forwards; }
    @keyframes popFade { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; } 30% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } 100% { transform: translate(-50%, -100%) scale(1.5); opacity: 0; } }

    .overlay{ position:absolute; inset:0; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); display:flex; justify-content:center; align-items:center; z-index: 100; transition: opacity 0.2s; }
    .panel{ background: white; padding: 25px; border-radius: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); text-align:center; width: 90%; max-width: 450px; animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); max-height: 85vh; display: flex; flex-direction: column; }
    @keyframes popUp { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .options-group { margin-bottom: 10px; text-align: left; }
    .label { font-size: 13px; font-weight: bold; color: #888; margin-bottom: 8px; display: block; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;}
    .chip { padding: 8px 12px; border: 2px solid #eee; border-radius: 15px; cursor: pointer; font-weight: bold; background: #fafafa; transition: all 0.2s; display: flex; align-items: center; gap: 6px; font-size: 13px; color: #aaa; filter: grayscale(1); } 
    .chip.owned { color: #333; filter: grayscale(0); border-color: #ddd; } 
    .chip:hover { transform: translateY(-2px); border-color: #ddd; }
    .chip.selected { border-color: #333; background: #333; color: white !important; box-shadow: 0 5px 15px rgba(0,0,0,0.2); filter: none; }
    .chip.bg-unlocked { border-color: #00b894; background: #f0fffa; color: #006266; filter: none; opacity: 1;} 
    .chip.bg-unlocked.selected { background: #00b894; color: white; }
    
    .btn-group { display: flex; gap: 8px; justify-content: center; margin-top: 10px; width: 100%; flex-wrap: wrap; }
    button { border: none; padding: 12px 18px; border-radius: 12px; font-size: 14px; font-weight: bold; cursor: pointer; transition: transform 0.1s; }
    button:active { transform: scale(0.95); }
    .btn-primary { background: #333; color: white; flex: 2; }
    .btn-secondary { background: #f0f0f0; color: #333; flex: 1; }
    .btn-share { background: #4a90e2; color: white; flex: 1; }
    .btn-rank { background: var(--accent); color: white; flex: 1; }
    .btn-shop { background: #FFD700; color: #333; flex: 1; border: 2px solid #e6c200; }
    
    /* 🛡️ 아이템 구매 버튼 스타일 */
    .item-group { display: flex; gap: 10px; margin-bottom: 15px; justify-content: center; }
    .btn-item { 
        background: #f8f9fa; border: 2px solid #ddd; color: #666; 
        padding: 10px; border-radius: 15px; width: 48%; text-align: center; cursor: pointer; position: relative; overflow: hidden;
    }
    .btn-item.active { background: #e3f2fd; border-color: #2196f3; color: #0d47a1; box-shadow: 0 0 10px rgba(33, 150, 243, 0.3); }
    .btn-item .price { font-size: 11px; display: block; margin-top: 4px; font-weight: normal; }
    
    .upgrade-row { display: flex; justify-content: space-between; align-items: center; background: #f9f9f9; padding: 10px; border-radius: 10px; margin-bottom: 8px; }
    .upgrade-info { text-align: left; }
    .upgrade-name { font-weight: bold; font-size: 14px; color: #333; }
    .upgrade-lv { font-size: 11px; color: #888; }
    .btn-upgrade { background: var(--accent); color: white; padding: 6px 12px; font-size: 12px; border-radius: 8px; }

    .hidden { display: none !important; }
    .shop-area { text-align: center; margin-top: 10px; }
    .shop-box { width: 100px; height: 100px; margin: 0 auto; background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="80" x="10" font-size="80">🎁</text></svg>') no-repeat center; background-size: contain; cursor: pointer; }
    .shop-box.shaking { animation: boxShake 0.5s infinite; }
    @keyframes boxShake { 0% { transform: rotate(0deg); } 25% { transform: rotate(10deg); } 50% { transform: rotate(-10deg); } 75% { transform: rotate(10deg); } 100% { transform: rotate(0deg); } }
    .gacha-msg { font-size: 15px; font-weight: bold; color: var(--accent); min-height: 24px; margin-bottom: 10px; }

    .rank-list { margin-top: 10px; flex: 1; min-height: 150px; overflow-y: auto; text-align: left; font-size: 13px; background: #fff; border: 1px solid #eee; padding: 5px; border-radius: 10px; }
    .rank-item { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #f0f0f0; }
  </style>
</head>
<body>

<div class="app">
  <div class="top-container">
    <div class="coin-badge">💰 <span id="userCoins">0</span></div>
    <div class="score-board">
      <div class="score-row"><span>🏆</span> <span class="score-val" id="bestScore">0</span></div>
      <div class="score-row"><span>🏃</span> <span class="score-val" id="currentScore">0</span></div>
    </div>
  </div>
  
  <div class="fever-bar-bg">
    <div id="feverBar" class="fever-bar-fill"></div>
  </div>

  <div class="stage" id="gameStage">
    <div class="player" id="player"></div>
    <div class="ground"></div>
    <div class="sound-toggle" id="soundBtn" style="position: absolute; top: 15px; right: 20px; font-size: 24px; z-index:30;">🔊</div>

    <div class="overlay" id="startOverlay">
      <div class="panel">
        <h1>게임 설정</h1>
        <p>보유 코인: 💰 <span id="startCoins">0</span></p>
        
        <div class="item-group">
            <div class="btn-item" id="btnShield" onclick="buyConsumable('shield')">
                <div style="font-size:20px;">🛡️</div>
                <div>방어막</div>
                <div class="price">1000 코인</div>
            </div>
            <div class="btn-item" id="btnBooster" onclick="buyConsumable('booster')">
                <div style="font-size:20px;">🚀</div>
                <div>부스터</div>
                <div class="price">500 코인</div>
            </div>
        </div>

        <div class="options-group">
          <span class="label">캐릭터</span>
          <div class="chips" id="charOptions"></div>
        </div>
        
        <div class="options-group">
          <span class="label">배경 테마</span>
          <div class="chips" id="bgOptions">
            <div class="chip selected" onclick="selectBg('bg-pink', this)">🌸 분홍</div>
            <div class="chip" onclick="selectBg('bg-sky', this)">☁️ 하늘</div>
            <div class="chip" onclick="selectBg('bg-green', this)">🌿 연두</div>
          </div>
        </div>
        <div class="btn-group">
            <button class="btn-shop" onclick="openShop()">🏪 상점/강화</button>
            <button class="btn-primary" onclick="startGame()">▶ 게임 시작</button>
        </div>
      </div>
    </div>

    <div class="overlay hidden" id="shopOverlay">
        <div class="panel">
            <h2>🏪 만물 상점</h2>
            <div class="label">보유 코인: 💰 <span id="shopCoins">0</span></div>
            
            <div style="width:100%; margin-bottom:15px; border-bottom:1px solid #eee; padding-bottom:10px;">
                <div class="label" style="text-align:left;">🆙 능력치 강화 (영구)</div>
                
                <div class="upgrade-row">
                    <div class="upgrade-info">
                        <div class="upgrade-name">🔥 피버 지속시간</div>
                        <div class="upgrade-lv" id="feverLvTxt">Lv.1 (5초)</div>
                    </div>
                    <button class="btn-upgrade" onclick="upgradeStat('fever')">강화 (1000)</button>
                </div>

                <div class="upgrade-row">
                    <div class="upgrade-info">
                        <div class="upgrade-name">🧲 코인 자석</div>
                        <div class="upgrade-lv" id="magnetLvTxt">Lv.0 (없음)</div>
                    </div>
                    <button class="btn-upgrade" onclick="upgradeStat('magnet')">강화 (1000)</button>
                </div>
            </div>

            <div class="shop-area">
                <div class="label">🎲 랜덤 스킨 뽑기</div>
                <div id="gachaBox" class="shop-box" onclick="drawGacha()"></div>
                <div id="gachaResult" class="gacha-msg"></div>
                <button class="btn-primary" onclick="drawGacha()">뽑기 (2000 코인)</button>
            </div>

            <div style="margin-top:15px;">
                <button class="btn-secondary" onclick="closeShop()">↩️ 나가기</button>
            </div>
        </div>
    </div>

    <div class="overlay hidden" id="gameOverOverlay">
      <div class="panel">
        <h1>게임 오버!</h1>
        <p>점수: <span id="finalScore">0</span></p>
        <div id="fortuneContainer"></div>
        <div id="unlockMsg" class="hidden" style="background:#fffbe6; padding:8px; border-radius:10px; font-size:13px; margin:5px 0;"></div>
        <div class="btn-group">
          <button class="btn-secondary" onclick="backToSettings()">⚙️ 설정</button>
          <button class="btn-primary" onclick="restartGame()">🔄 재시작</button>
        </div>
        <div class="btn-group">
            <button class="btn-secondary" onclick="shareScore()">🔗 공유</button>
            <button class="btn-rank" onclick="openRanking()">🏆 랭킹</button>
        </div>
      </div>
    </div>
    <div class="overlay hidden" id="rankingOverlay">
        <div class="panel" style="height:80vh;">
            <h2>🏆 명예의 전당</h2>
            <div class="rank-form">
                <input type="text" id="nicknameInput" class="rank-input" placeholder="닉네임" maxlength="8">
                <button class="btn-submit" onclick="submitRank()">등록</button>
            </div>
            <div id="rankList" class="rank-list">로딩 중...</div>
            <button class="btn-secondary" style="margin-top:10px;" onclick="closeRanking()">닫기</button>
        </div>
    </div>

  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxOVBxkJTLgKv2CavJFxbdG4ogMkXea2D1GN4ADPahaJry6tulCl_haMOBN8-qiV7-8oA/exec"; 

  // DOM Elements
  const player = document.getElementById('player');
  const stage = document.getElementById('gameStage');
  const startOverlay = document.getElementById('startOverlay');
  const gameOverOverlay = document.getElementById('gameOverOverlay');
  const shopOverlay = document.getElementById('shopOverlay');
  const rankingOverlay = document.getElementById('rankingOverlay');
  
  const scoreEl = document.getElementById('currentScore');
  const finalScoreEl = document.getElementById('finalScore');
  const bestScoreEl = document.getElementById('bestScore');
  const userCoinsEl = document.getElementById('userCoins');
  const startCoinsEl = document.getElementById('startCoins');
  const shopCoinsEl = document.getElementById('shopCoins');
  const charOptions = document.getElementById('charOptions');
  const bgOptions = document.getElementById('bgOptions');
  const gachaBox = document.getElementById('gachaBox');
  const gachaResult = document.getElementById('gachaResult');
  const feverBar = document.getElementById('feverBar');
  const rankList = document.getElementById('rankList');
  const nicknameInput = document.getElementById('nicknameInput');
  const unlockMsg = document.getElementById('unlockMsg');
  const fortuneContainer = document.getElementById('fortuneContainer');

  // Game Data
  let myChar = { type: 'image', val: 'dog.png' }; 
  let selectedBgType = 'bg-pink'; 
  let isSpecialTheme = false; 

  let best = Number(localStorage.getItem('runnerBest') || 0);
  let totalCoins = Number(localStorage.getItem('runnerCoins') || 0);
  let ownedSkins = JSON.parse(localStorage.getItem('runnerSkins')) || ["dog.png"];
  
  // 🆙 업그레이드 데이터 (레벨 저장)
  let feverLv = Number(localStorage.getItem('feverLv') || 1);
  let magnetLv = Number(localStorage.getItem('magnetLv') || 0);

  // 🛡️ 소모품 상태 (이번 판 적용 여부)
  let hasShield = false;
  let hasBooster = false;

  const SKIN_DB = [
      { id: 'dog.png', name: '🐶 강아지', type: 'image', obtain: 'default' },
      { id: 'cat.png', name: '🐱 고양이', type: 'image', obtain: 'gacha' },
      { id: 'rabbit.png', name: '🐰 토끼', type: 'image', obtain: 'gacha' },
      { id: '🐼', name: '🐼 판다', type: 'emoji', obtain: 'gacha' },
      { id: '👽', name: '👽 외계인', type: 'emoji', obtain: 'gacha' },
      { id: '🦄', name: '🦄 유니콘', type: 'emoji', obtain: 'gacha' },
      { id: 'tiger.png', name: '🐯 호랑이', type: 'image', obtain: 'score', req: 1000 },
      { id: 'dragon.png', name: '🐲 용', type: 'image', obtain: 'score', req: 2000 }
  ];

  let isRunning = false;
  let score = 0;
  let animationId;
  let frameCount = 0;
  let gameSpeed = 7.5;
  let playerY = 0;
  let velocityY = 0;
  let jumpCount = 0;
  let feverGauge = 0;
  let isFever = false;
  const gravity = 0.8;
  const jumpPower = 14;
  const GROUND_HEIGHT = 40;
  
  // FPS Control
  let lastTime = 0; 
  const fpsInterval = 1000 / 60; 

  let obstacles = [];
  let items = []; 

  const UNLOCK_SCORE_TIGER = 1000;
  const UNLOCK_SCORE_DRAGON = 2000;
  const BG_UNLOCK_SUNSET = 1000;
  const BG_UNLOCK_MIDNIGHT = 1500;
  const BG_UNLOCK_SPACE = 2000;
  const BG_UNLOCK_AURORA = 2500;

  // Audio
  let audioCtx = null;
  let isMuted = false;

  // Init
  bestScoreEl.innerText = best;
  updateCoinUI();
  renderCharOptions();
  updatePlayerImage();
  checkHiddenUnlock();
  updateUpgradeUI();

  // --- 소모품 구매 로직 ---
  function buyConsumable(type) {
      if (type === 'shield') {
          if (hasShield) { alert("이미 방어막을 장착했습니다!"); return; }
          if (totalCoins < 1000) { alert("코인이 부족합니다! (1000 필요)"); return; }
          if (confirm("방어막을 구매하시겠습니까? (1회용)")) {
              totalCoins -= 1000; hasShield = true;
              document.getElementById('btnShield').classList.add('active');
              updateCoinUI();
          }
      } else if (type === 'booster') {
          if (hasBooster) { alert("이미 부스터를 장착했습니다!"); return; }
          if (totalCoins < 500) { alert("코인이 부족합니다! (500 필요)"); return; }
          if (confirm("부스터를 구매하시겠습니까? (1회용)")) {
              totalCoins -= 500; hasBooster = true;
              document.getElementById('btnBooster').classList.add('active');
              updateCoinUI();
          }
      }
  }

  // --- 업그레이드 로직 ---
  function upgradeStat(type) {
      const cost = 1000; // 고정 비용 (원하면 레벨별 증가 가능)
      if (totalCoins < cost) { alert("코인이 부족합니다!"); return; }

      if (type === 'fever') {
          if(feverLv >= 5) { alert("이미 최대 레벨입니다!"); return; }
          totalCoins -= cost;
          feverLv++;
          localStorage.setItem('feverLv', feverLv);
          alert(`🔥 피버 강화 성공! (Lv.${feverLv})`);
      } else if (type === 'magnet') {
          if(magnetLv >= 5) { alert("이미 최대 레벨입니다!"); return; }
          totalCoins -= cost;
          magnetLv++;
          localStorage.setItem('magnetLv', magnetLv);
          alert(`🧲 자석 강화 성공! (Lv.${magnetLv})`);
      }
      updateCoinUI();
      updateUpgradeUI();
  }

  function updateUpgradeUI() {
      const feverSec = 5 + (feverLv - 1); // Lv1=5초, Lv2=6초...
      document.getElementById('feverLvTxt').innerText = `Lv.${feverLv} (${feverSec}초)`;
      
      const magTxt = magnetLv === 0 ? "없음" : `Lv.${magnetLv} (범위 ${magnetLv*50}px)`;
      document.getElementById('magnetLvTxt').innerText = magTxt;
  }

  // --- 기본 UI/Game ---
  function updateCoinUI() {
      if(userCoinsEl) userCoinsEl.innerText = totalCoins;
      if(startCoinsEl) startCoinsEl.innerText = totalCoins;
      if(shopCoinsEl) shopCoinsEl.innerText = totalCoins;
      localStorage.setItem('runnerCoins', totalCoins);
  }

  function updatePlayerImage() { 
      if (myChar.type === 'image') {
          player.innerHTML = `<img src="${myChar.val}" alt="Char">`;
          player.classList.remove('emoji-char');
      } else {
          player.innerHTML = myChar.val;
          player.classList.add('emoji-char');
      }
  }

  function selectBg(className, element) {
    selectedBgType = className;
    document.querySelectorAll('#bgOptions .chip').forEach(opt => opt.classList.remove('selected'));
    element.classList.add('selected');
    document.body.className = className;
    isSpecialTheme = true;
  }

  function checkHiddenUnlock() {
      if (best >= 1000 && !document.getElementById('bgSunset')) addBgOption('bg-sunset', '🔥 노을', 'bgSunset');
      if (best >= 1500 && !document.getElementById('bgMidnight')) addBgOption('bg-midnight', '🌃 심해', 'bgMidnight');
      if (best >= 2000 && !document.getElementById('bgSpace')) addBgOption('bg-space', '🚀 우주', 'bgSpace');
      if (best >= 2500 && !document.getElementById('bgAurora')) addBgOption('bg-aurora', '🌈 오로라', 'bgAurora');
  }
  function addBgOption(cls, name, id) {
      const chip = document.createElement('div');
      chip.id = id; chip.className = 'chip bg-unlocked'; chip.innerText = name;
      chip.onclick = function() { selectBg(cls, this); };
      bgOptions.appendChild(chip);
  }

  function openShop() { startOverlay.classList.add('hidden'); shopOverlay.classList.remove('hidden'); }
  function closeShop() { shopOverlay.classList.add('hidden'); startOverlay.classList.remove('hidden'); renderCharOptions(); }

  function drawGacha() {
      const COST = 2000; // 💰 가챠 비용 인상
      if (totalCoins < COST) { alert(`코인이 부족합니다! (${COST} 필요)`); return; }
      totalCoins -= COST; updateCoinUI();
      gachaBox.classList.add('shaking'); gachaResult.innerText = "두근두근...";
      setTimeout(() => {
          gachaBox.classList.remove('shaking');
          const picked = SKIN_DB.filter(s => s.obtain === 'gacha')[Math.floor(Math.random() * 5)]; // 가챠 풀
          let msg = "";
          if (ownedSkins.includes(picked.id)) {
              totalCoins += 500; updateCoinUI(); msg = `💥 중복! [${picked.name}] (500환급)`;
          } else {
              ownedSkins.push(picked.id); localStorage.setItem('runnerSkins', JSON.stringify(ownedSkins)); msg = `🎉 [${picked.name}] 획득!`;
          }
          gachaResult.innerText = msg;
      }, 1000);
  }

  function renderCharOptions() {
      charOptions.innerHTML = "";
      SKIN_DB.forEach(skin => {
          const isOwned = ownedSkins.includes(skin.id);
          const el = document.createElement('div');
          el.className = `chip ${isOwned ? 'owned' : ''} ${myChar.val === skin.id ? 'selected' : ''}`;
          el.innerText = skin.name;
          if (!isOwned) el.style.opacity = "0.5";
          else el.onclick = () => { myChar = {type:skin.type, val:skin.id}; renderCharOptions(); updatePlayerImage(); };
          charOptions.appendChild(el);
      });
  }

  // --- Audio ---
  function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
  function playSound(type) { if(!audioCtx || isMuted) return; const osc=audioCtx.createOscillator(); const g=audioCtx.createGain(); osc.connect(g); g.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime+0.1); }
  document.getElementById('soundBtn').addEventListener('click', ()=>{ isMuted=!isMuted; });

  // --- Game Loop & Logic ---
  function startGame() {
    initAudio();
    startOverlay.classList.add('hidden');
    
    // 🛡️ 방어막 시각 효과
    if (hasShield) {
        const shieldDiv = document.createElement('div');
        shieldDiv.className = 'shield-effect';
        shieldDiv.id = 'playerShield';
        player.appendChild(shieldDiv);
    }

    isRunning = true; score = 0; gameSpeed = 7.5; 
    obstacles = []; items = []; lastTime = 0;
    document.querySelectorAll('.obstacle').forEach(e => e.remove());
    document.querySelectorAll('.item-star').forEach(e => e.remove());
    player.classList.remove('dead'); player.classList.add('running');
    
    // 🚀 부스터 로직
    if (hasBooster) {
        gameSpeed = 20; // 초반 가속
        createFloatText(100, 200, "🚀 BOOST!!");
    }

    animationId = requestAnimationFrame(gameLoop);
  }

  function gameLoop(timestamp) {
    if (!isRunning) return;
    animationId = requestAnimationFrame(gameLoop);
    if (!lastTime) { lastTime = timestamp; return; }
    if (timestamp - lastTime < (1000/60)) return; // 60FPS
    lastTime = timestamp;

    // 부스터 종료 체크
    if (hasBooster && score > 500) {
        hasBooster = false;
        gameSpeed = 10; // 정상 속도 복귀
    }

    if (!isFever && gameSpeed < 25 && !hasBooster) gameSpeed += 0.0015;
    if (frameCount++ % 6 === 0) { score += (isFever ? 3 : 1); scoreEl.innerText = score; }

    // 물리
    playerY += velocityY; velocityY -= gravity;
    if (playerY <= 0) { playerY = 0; jumpCount = 0; }
    player.style.bottom = (GROUND_HEIGHT + playerY) + "px";

    // 생성
    if (frameCount % Math.floor(150 - gameSpeed*2) === 0 || Math.random() < 0.005) createObstacle();
    if (frameCount % 200 === 0) createItem();

    moveObstacles(); moveItems();
  }

  function createObstacle() {
      if (hasBooster) return; // 부스터 중엔 장애물 안 나옴 (편의성)
      const obs = document.createElement('div');
      obs.classList.add('obstacle');
      obs.innerText = Math.random() < 0.3 ? "🦅" : "🌵";
      if(obs.innerText==="🦅") obs.classList.add('bird');
      obs.xPos = stage.clientWidth + 50;
      obs.style.left = obs.xPos + "px";
      obs.style.bottom = (obs.innerText==="🦅" ? GROUND_HEIGHT + 40 : GROUND_HEIGHT) + "px";
      stage.appendChild(obs); obstacles.push(obs);
  }

  function createItem() {
      const item = document.createElement('div');
      item.className = 'item-star'; item.innerText = '⭐';
      item.xPos = stage.clientWidth + 50;
      item.style.left = item.xPos + 'px';
      item.style.bottom = (GROUND_HEIGHT + 50 + Math.random()*50) + 'px';
      stage.appendChild(item); items.push(item);
  }

  function moveItems() {
      for (let i = items.length - 1; i >= 0; i--) {
          let item = items[i];
          
          // 🧲 자석 효과 구현
          if (magnetLv > 0) {
              const magnetRange = 150 + (magnetLv * 50); // 레벨당 범위 증가
              const dx = (50) - item.xPos; // 플레이어 X(50) 쪽으로
              const dist = Math.abs(dx);
              if (dist < magnetRange) {
                  item.xPos += (dx * 0.1); // 빨려옴
                  item.style.bottom = (parseInt(item.style.bottom) * 0.9) + (GROUND_HEIGHT * 0.1) + "px"; // 바닥으로도 살짝 유도
              }
          }

          item.xPos -= gameSpeed; 
          item.style.left = item.xPos + "px";

          // 획득
          if (item.xPos > 30 && item.xPos < 90) {
             const itemH = parseInt(item.style.bottom);
             if (playerY + 100 > itemH) { // 대충 닿으면 획득
                 score += 50; 
                 // 피버 게이지
                 if (!isFever) { 
                     feverGauge += 20; 
                     document.getElementById('feverBar').style.width = feverGauge + '%';
                     if (feverGauge >= 100) startFever(); 
                 }
                 item.remove(); items.splice(i, 1);
             }
          }
          if(item.xPos < -50) { item.remove(); items.splice(i, 1); }
      }
  }

  function startFever() {
      isFever = true; 
      document.body.classList.add('fever-mode');
      const duration = 5000 + ((feverLv-1) * 1000); // 레벨당 1초 추가
      setTimeout(() => { 
          isFever = false; feverGauge = 0; 
          document.body.classList.remove('fever-mode');
          document.getElementById('feverBar').style.width = '0%';
      }, duration);
  }

  function moveObstacles() {
    for (let i = obstacles.length - 1; i >= 0; i--) {
      let obs = obstacles[i]; obs.xPos -= gameSpeed; obs.style.left = obs.xPos + "px";
      
      if (obs.xPos > 50 && obs.xPos < 90) {
          const obsH = parseInt(obs.style.bottom);
          if (playerY < obsH + 30 && playerY + 50 > obsH + 10) {
              if (isFever || hasBooster) {
                  // 무적 상태
                  obs.remove(); obstacles.splice(i, 1);
              } else if (hasShield) {
                  // 🛡️ 방어막 발동!
                  hasShield = false;
                  const shield = document.getElementById('playerShield');
                  if(shield) shield.remove(); // 시각 효과 제거
                  obs.remove(); obstacles.splice(i, 1); // 장애물 제거
                  createFloatText(50, playerY+50, "🛡️ BLOCK!");
                  // 잠깐 무적 or 감속 효과 줄 수도 있음
              } else {
                  gameOver(); return;
              }
          }
      }
      if (obs.xPos < -50) { obs.remove(); obstacles.splice(i, 1); }
    }
  }

  function createFloatText(x, y, text) {
      const el = document.createElement('div'); 
      el.className = 'float-text'; el.innerText = text;
      el.style.left = x+'px'; el.style.bottom = y+'px';
      stage.appendChild(el); setTimeout(()=>el.remove(), 800);
  }

  function gameOver() {
      isRunning = false;
      
      // 초기화
      document.getElementById('btnShield').classList.remove('active');
      document.getElementById('btnBooster').classList.remove('active');
      hasShield = false; hasBooster = false;

      totalCoins += Math.floor(score);
      localStorage.setItem('runnerCoins', totalCoins);
      if(score > best) { best = score; localStorage.setItem('runnerBest', best); }
      
      updateCoinUI();
      gameOverOverlay.classList.remove('hidden');
  }

  function backToSettings() {
      gameOverOverlay.classList.add('hidden');
      startOverlay.classList.remove('hidden');
  }

  window.addEventListener('keydown', (e)=>{ if(e.code==='Space') isRunning ? jump() : startGame(); });
  stage.addEventListener('touchstart', ()=>{ isRunning ? jump() : startGame(); });
  stage.addEventListener('mousedown', ()=>{ isRunning ? jump() : startGame(); });

</script>
</body>
</html>
