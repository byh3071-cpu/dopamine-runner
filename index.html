<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Dopamine Runner: Final V3 🎲</title>
  
  <style>
    @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css");

    :root{ --bg:#fde2ff; --panel: rgba(255,255,255,0.95); --ink:#2a2a2a; --accent: #6200ea; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body { 
        margin:0; height: 100dvh; display:flex; justify-content: center; align-items: center; 
        background-color: var(--bg); 
        background-position: center; background-size: cover; background-repeat: no-repeat;
        font-family: "Pretendard", sans-serif; color:var(--ink); overflow:hidden; 
        touch-action: none; user-select: none; -webkit-user-select: none; 
        transition: background-image 0.5s ease; 
    }

    /* 배경 이미지 */
    body.bg-pink { background-image: url('bg_pink.png') !important; color: #333; }
    body.bg-sky { background-image: url('bg_sky.png') !important; color: #333; }
    body.bg-green { background-image: url('bg_green.png') !important; color: #333; }
    body.bg-sunset { background-image: url('bg_sunset.png') !important; color: white !important; }
    body.bg-space { background-image: url('bg_space.png') !important; color: white !important; }
    body.bg-midnight { background-image: url('bg_aurora.png') !important; color: white !important; } /* 오로라 */
    body.bg-aurora { background-image: url('bg_midnight.png') !important; color: white !important; } /* 심해 */

    /* 피버 모드 */
    body.fever-mode { background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000) !important; background-size: 400%; animation: rainbowBg 0.5s linear infinite !important; color: white !important; }
    @keyframes rainbowBg { 0% {background-position: 0%;} 100% {background-position: 400%;} }

    .app{ width: 100%; height: 100%; position:relative; display: flex; flex-direction: column; }
    
    /* 상단 UI */
    .top-container { position: relative; margin: 15px; z-index: 20; flex-shrink: 0; display:flex; justify-content: space-between; align-items: flex-start; }
    .coin-box { background: #FFD700; color: #333; padding: 8px 15px; border-radius: 20px; font-weight: 900; font-size: 15px; box-shadow: 0 4px 5px rgba(0,0,0,0.2); border: 2px solid #fff; display: flex; align-items: center; gap: 5px; }
    .score-container { background: var(--panel); padding: 8px 15px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: right; display: flex; flex-direction: column; gap: 2px; }
    .score-row { font-size: 13px; font-weight: bold; color: #666; }
    .score-row span { font-size: 16px; font-weight: 900; color: var(--ink); margin-left: 5px; }
    .score-row.current span { color: var(--accent); font-size: 18px; }

    .fever-bar-container { position: absolute; top: 60px; left: 20px; right: 20px; z-index: 15; pointer-events: none; }
    .fever-bar-bg { width: 100%; height: 8px; background: rgba(0,0,0,0.2); border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.5); }
    .fever-bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #fbc02d, #ffeb3b); transition: width 0.2s; }
    .fever-bar-fill.full { background: linear-gradient(90deg, #ff0000, #ffff00); animation: pulseBar 0.2s infinite; }
    @keyframes pulseBar { 0%{opacity:1;} 50%{opacity:0.7;} 100%{opacity:1;} }

    .stage{ position:relative; flex-grow: 1; width: 100%; overflow:hidden; user-select:none; cursor: pointer; transform: translateZ(0); }
    .stage.shake { animation: shakeAnim 0.5s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes shakeAnim { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }

    .ground{ position: absolute; bottom:0; width: 100%; height: 40px; background: rgba(255,255,255,0.6); border-top: 3px solid rgba(255,255,255,0.8); transition: background 1.5s; }
    body.bg-midnight .ground, body.bg-space .ground, body.bg-aurora .ground, body.bg-sunset .ground { background: rgba(255,255,255,0.15); border-top: 3px solid rgba(255,255,255,0.3); }

    .player { position: absolute; left: 50px; bottom: 40px; width: 80px; height: 80px; z-index: 10; display:flex; align-items:center; justify-content:center; font-size: 55px; transform-origin: bottom center; }
    .player img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; filter: drop-shadow(0 4px 2px rgba(0,0,0,0.2)); }
    .player.giant { transform: scale(1.5); filter: drop-shadow(0 0 15px gold); }
    .player.running img, .player.running.emoji-char { animation: runWobble 0.3s infinite linear; }
    .player.spin img, .player.spin.emoji-char { animation: spinPlayer 0.5s ease-out; }
    .player.landing img, .player.landing.emoji-char { animation: landSquash 0.15s ease-out forwards; }
    .player.dead { animation: knockback 0.8s forwards ease-out; }

    @keyframes runWobble { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
    @keyframes spinPlayer { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes landSquash { 0% { transform: scale(1.3, 0.7); } 100% { transform: scale(1, 1); } }
    @keyframes knockback { 0% { transform: scale(1) rotate(0deg); opacity: 1; } 100% { transform: scale(0.8) rotate(720deg) translate(200px, -200px); opacity: 0; } }

    .trail { position: absolute; width: 80px; height: 80px; opacity: 0.5; pointer-events: none; z-index: 5; filter: grayscale(1) blur(1px); display:flex; align-items:center; justify-content:center; font-size: 55px; }
    .trail img { width: 100%; height: 100%; object-fit: contain; }

    .obstacle{ position:absolute; width:50px; height:50px; font-size:40px; display:flex; align-items:center; justify-content:center; }
    .obstacle.bird { animation: fly 0.6s infinite alternate ease-in-out; font-size: 45px; }
    @keyframes fly { from { transform: translateY(0); } to { transform: translateY(-10px); } }
    body.bg-midnight .obstacle, body.bg-space .obstacle { filter: brightness(1.5); }
    .item-star { position: absolute; width: 40px; height: 40px; font-size: 35px; z-index: 9; animation: spinStar 2s infinite linear; }
    @keyframes spinStar { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    .dust { position: absolute; width: 40px; height: 20px; background: white; border-radius: 50%; opacity: 0.8; z-index: 5; animation: dustAnim 0.3s forwards; }
    @keyframes dustAnim { 0% { transform: scale(0.5); opacity: 0.8; } 100% { transform: scale(1.5) translateY(-10px); opacity: 0; } }
    .float-text { position: absolute; font-weight: 900; color: #ffeb3b; font-size: 24px; z-index: 50; text-shadow: 2px 2px 0 #000; animation: floatUp 0.8s forwards; }
    @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-60px) scale(1.2); opacity: 0; } }
    .milestone-text { position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%); font-size: 40px; font-weight: bold; color: #FFD700; text-shadow: 2px 2px 0 #000; z-index: 50; animation: popFade 1.5s forwards; white-space: nowrap; }
    @keyframes popFade { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; } 30% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } 100% { transform: translate(-50%, -100%) scale(1.5); opacity: 0; } }

    /* 🎨 [UI 대폭 개선] 패널 디자인 */
    .overlay{ position:absolute; inset:0; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); display:flex; justify-content:center; align-items:center; z-index: 100; }
    
    .panel { 
        background: white; 
        padding: 30px 25px; /* 여백 증가 */
        border-radius: 30px; 
        box-shadow: 0 20px 60px rgba(0,0,0,0.4); 
        text-align:center; 
        width: 90%; 
        max-width: 450px; /* 패널 폭 넓힘 */
        max-height: 90vh; 
        display: flex; flex-direction: column; 
        overflow-y: auto; 
        gap: 10px; /* 내부 요소 간격 추가 */
    }
    
    .hidden { display: none !important; }

    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 5px; justify-content: center; }
    .chip { padding: 10px 15px; border: 2px solid #eee; border-radius: 20px; cursor: pointer; font-weight: bold; background: #fafafa; font-size: 14px; color: #aaa; filter: grayscale(1); } 
    .chip.owned { color: #333; filter: grayscale(0); border-color: #ddd; } 
    .chip.selected { border-color: #333; background: #333; color: white !important; filter: none; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    .chip.bg-unlocked { border-color: #00b894; background: #f0fffa; color: #006266; filter: none; opacity: 1;}
    .chip.bg-unlocked.selected { background: #00b894; color: white; }

    /* 버튼 스타일 개선 */
    .btn-group { display: flex; gap: 12px; justify-content: center; margin-top: 10px; width: 100%; }
    button { border: none; padding: 14px; border-radius: 15px; font-size: 16px; font-weight: 800; cursor: pointer; transition: transform 0.1s; }
    button:active { transform: scale(0.95); }
    .btn-primary { background: #333; color: white; flex: 1; }
    .btn-shop { background: #FFD700; color: #333; flex: 1; border: 2px solid #e6c200; }
    .btn-secondary { background: #f0f0f0; color: #333; flex: 1; }
    .btn-rank { background: var(--accent); color: white; flex: 1; }
    .btn-submit { background: var(--accent); color: white; flex: 0 0 70px; }

    .support-group { margin-top: 15px; border-top: 2px dashed #eee; padding-top: 15px; display: flex; gap: 10px; }
    .btn-support { font-size: 13px; padding: 12px; flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px; font-weight: bold; }
    .btn-ctee { background: #fffbe6; color: #d48806; border: 2px solid #d48806; }
    .btn-bmc { background: #FFDD00; color: #333; border: 2px solid #e6c700; }

    .shop-area { text-align: center; margin-top: 10px; }
    .shop-box { width: 100px; height: 100px; margin: 0 auto; background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y="80" x="10" font-size="80">🎁</text></svg>') no-repeat center; background-size: contain; cursor: pointer; }
    .shop-box.shaking { animation: boxShake 0.5s infinite; }
    @keyframes boxShake { 0% { transform: rotate(0deg); } 25% { transform: rotate(10deg); } 50% { transform: rotate(-10deg); } 75% { transform: rotate(10deg); } 100% { transform: rotate(0deg); } }
    .gacha-msg { font-size: 16px; font-weight: bold; color: var(--accent); min-height: 24px; margin-bottom: 10px; }

    .sound-toggle { position: absolute; top: 10px; right: 10px; font-size: 24px; cursor: pointer; z-index: 30; background: rgba(255,255,255,0.7); border-radius: 50%; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; }
    
    /* 📋 [수정됨] 랭킹 리스트 높이 고정 (잘림 방지) */
    .rank-list { 
        margin-top: 10px; flex: 1; 
        min-height: 250px; /* 최소 높이 확보 */
        max-height: 400px; /* 너무 길어지면 스크롤 */
        overflow-y: auto; text-align: left; 
        font-size: 14px; background: #f9f9f9; 
        border-radius: 15px; padding: 15px; 
    }
    .rank-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
    .rank-form { display: flex; gap: 8px; margin-bottom: 5px; }
    .rank-input { flex: 1; padding: 12px; border: 2px solid #ddd; border-radius: 12px; font-size: 15px; }
    .fortune-area { margin-top: 15px; border-top: 2px dashed #eee; padding-top: 15px; text-align: center; }
    .btn-fortune { background: linear-gradient(45deg, #ff9a9e, #fad0c4); color: white; width: 100%; border: none; font-size: 15px; padding: 12px; }
  </style>
</head>
<body class="bg-pink"> 

<div class="app">
  <div class="top-container">
    <div class="coin-box">
      💰 <span id="userCoins">0</span>
    </div>
    <div class="score-container">
      <div class="score-row">🏆 <span id="bestScore">0</span></div>
      <div class="score-row current">⚡ <span id="currentScore">0</span></div>
    </div>
  </div>
  
  <div class="fever-bar-container">
      <div class="fever-bar-bg">
          <div id="feverBar" class="fever-bar-fill"></div>
      </div>
  </div>

  <div class="stage" id="gameStage">
    <div class="player" id="player"></div>
    <div class="ground"></div>
    <div class="sound-toggle" id="soundBtn" title="배경음악">🔊</div>

    <div class="overlay" id="startOverlay">
      <div class="panel">
        <h1 style="margin: 10px 0;">🏃 게임 설정</h1>
        <p style="margin: 0 0 15px 0;">보유 코인: 💰 <span id="startCoins">0</span></p>
        <div class="options-group">
          <div class="chips" id="charOptions"></div>
        </div>
        <div class="options-group">
          <div class="chips" id="bgOptions">
            <div class="chip selected" onclick="selectBg('bg-pink', this)">🌸 분홍</div>
            <div class="chip" onclick="selectBg('bg-sky', this)">☁️ 하늘</div>
            <div class="chip" onclick="selectBg('bg-green', this)">🌿 연두</div>
          </div>
        </div>
        <div class="btn-group">
            <button class="btn-shop" onclick="openShop()">🏪 상점</button>
            <button class="btn-primary" onclick="startGame()">▶ 게임 시작</button>
        </div>
      </div>
    </div>

    <div class="overlay hidden" id="shopOverlay">
        <div class="panel">
            <h2>🏪 스킨 상점</h2>
            <p>500코인으로 뽑기!<br>(중복 시 300코인 환급)</p>
            <div style="font-weight:bold; margin-bottom:10px;">보유: 💰 <span id="shopCoins">0</span></div>
            <div class="shop-area">
                <div id="gachaBox" class="shop-box" onclick="drawGacha()"></div>
                <div id="gachaResult" class="gacha-msg"></div>
                <button class="btn-primary" onclick="drawGacha()">🎲 뽑기 (500)</button>
            </div>
            <div style="margin-top:15px; width:100%;">
                <button class="btn-secondary" style="width:100%;" onclick="closeShop()">↩️ 나가기</button>
            </div>
        </div>
    </div>

    <div class="overlay hidden" id="gameOverOverlay">
      <div class="panel">
        <h2 style="font-size:45px; margin:0;">😵‍💫</h2>
        <h1 style="margin: 5px 0;">게임 오버!</h1>
        <p style="font-size:20px; font-weight:bold; margin: 10px 0; color:#333;">
            점수: <span id="finalScore" style="color:var(--accent); font-size:24px;">0</span>
        </p>
        
        <div class="fortune-area" id="fortuneContainer"></div>
        <div id="unlockMsg" class="hidden" style="color:#d48806; font-weight:bold; margin-bottom:10px; background:#fffbe6; padding:8px; border-radius:10px; font-size:13px;"></div>

        <div class="btn-group">
          <button class="btn-secondary" onclick="backToSettings()">⚙️ 설정</button>
          <button class="btn-primary" onclick="restartGame()">🔄 재시작</button>
        </div>
        
        <div class="btn-group">
            <button class="btn-secondary" onclick="shareScore()">🔗 공유</button>
            <button class="btn-rank" onclick="openRanking()">🏆 랭킹</button>
        </div>
        
        <div class="support-group">
            <button class="btn-support btn-ctee" onclick="window.open('https://ctee.kr/place/byh3071', '_blank')">☕ 크티 후원</button>
            <button class="btn-support btn-bmc" onclick="window.open('https://buymeacoffee.com/byh3071x?status=1', '_blank')">🌍 BMC</button>
        </div>
      </div>
    </div>

    <div class="overlay hidden" id="rankingOverlay">
        <div class="panel">
            <h2>🏆 명예의 전당</h2>
            <div class="rank-form">
                <input type="text" id="nicknameInput" class="rank-input" placeholder="닉네임 (최대 8자)" maxlength="8">
                <button class="btn-submit" onclick="submitRank()">등록</button>
            </div>
            <div id="rankList" class="rank-list">
                <div style="text-align:center; padding:30px; color:#999;">
                    데이터를 불러오는 중...<br>(잠시만 기다려주세요)
                </div>
            </div>
            <div style="margin-top:10px; width:100%;">
                <button class="btn-secondary" style="width:100%;" onclick="closeRanking()">↩️ 뒤로가기</button>

  </div>
</div>

<script>
  // ⚠️ 본인의 구글 앱스 스크립트 URL 확인
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz4oxlHh4I9KvBj1rlgTdDCxFDrpwMugkfFzNZOMIG1ZzakJb93QD2KVdnmY2LuqOQZ3Q/exec"; 

  const player = document.getElementById('player');
  const stage = document.getElementById('gameStage');
  const startOverlay = document.getElementById('startOverlay');
  const gameOverOverlay = document.getElementById('gameOverOverlay');
  const shopOverlay = document.getElementById('shopOverlay');
  const rankingOverlay = document.getElementById('rankingOverlay');
  
  const scoreEl = document.getElementById('currentScore');
  const finalScoreEl = document.getElementById('finalScore');
  const bestScoreEl = document.getElementById('bestScore');
  const userCoinsEl = document.getElementById('userCoins');
  const startCoinsEl = document.getElementById('startCoins');
  const shopCoinsEl = document.getElementById('shopCoins');
  const charOptions = document.getElementById('charOptions');
  const bgOptions = document.getElementById('bgOptions');
  const gachaBox = document.getElementById('gachaBox');
  const gachaResult = document.getElementById('gachaResult');
  const feverBar = document.getElementById('feverBar');
  const soundBtn = document.getElementById('soundBtn');
  const rankList = document.getElementById('rankList');
  const nicknameInput = document.getElementById('nicknameInput');
  const unlockMsg = document.getElementById('unlockMsg');
  const fortuneContainer = document.getElementById('fortuneContainer');

  let myChar = { type: 'image', val: 'dog.png' }; 
  let best = Number(localStorage.getItem('runnerBest') || 0);
  let totalCoins = Number(localStorage.getItem('runnerCoins') || 0);
  let ownedSkins = JSON.parse(localStorage.getItem('runnerSkins') || '["dog.png"]');

  const SKIN_DB = [
      { id: 'dog.png', name: '🐶 강아지', type: 'image', obtain: 'default' },
      { id: 'cat.png', name: '🐱 고양이', type: 'image', obtain: 'gacha' },
      { id: 'rabbit.png', name: '🐰 토끼', type: 'image', obtain: 'gacha' },
      { id: '🐼', name: '🐼 판다', type: 'emoji', obtain: 'gacha' },
      { id: '👽', name: '👽 외계인', type: 'emoji', obtain: 'gacha' },
      { id: '🦄', name: '🦄 유니콘', type: 'emoji', obtain: 'gacha' }
  ];

  let isRunning = false;
  let score = 0;
  let animationId;
  let frameCount = 0;
  let gameSpeed = 7.5;
  let playerY = 0;
  let velocityY = 0;
  let jumpCount = 0;
  let feverGauge = 0;
  let isFever = false;
  const gravity = 0.8;
  const jumpPower = 14;
  const GROUND_HEIGHT = 40;
  let obstacles = [];
  let items = [];

  const UNLOCK_SCORE_TIGER = 1000;
  const UNLOCK_SCORE_DRAGON = 2000;
  const BG_UNLOCK_SUNSET = 1000;
  const BG_UNLOCK_MIDNIGHT = 1500;
  const BG_UNLOCK_SPACE = 2000;
  const BG_UNLOCK_AURORA = 2500;

  let audioCtx = null;
  let isMuted = false;

  bestScoreEl.innerText = best;
  updateCoinUI();
  renderCharOptions();
  updatePlayerImage();
  checkHiddenUnlock();

  // --- 사운드 ---
  function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
  
  function playBGM() {
    if (isMuted || !audioCtx) return; stopBGM(); 
    const notes = [392, 392, 440, 392, 523, 493, 392, 392, 440, 392, 587, 523]; 
    let time = audioCtx.currentTime;
    notes.forEach((freq, index) => createOscillator(freq, time + index * 0.4, 0.2, 'square'));
    window.bgmInterval = setInterval(() => {
       if(!isRunning || isMuted) { clearInterval(window.bgmInterval); return; }
       let t = audioCtx.currentTime;
       notes.forEach((freq, index) => createOscillator(freq, t + index * 0.4, 0.2, 'square'));
    }, notes.length * 400);
  }

  function createOscillator(freq, startTime, duration, type = 'square') {
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.03, startTime); gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(startTime); osc.stop(startTime + duration);
  }

  function playSound(type) {
      if(!audioCtx || isMuted) return;
      if(type === 'coin') { createOscillator(880, audioCtx.currentTime, 0.1, 'sine'); createOscillator(1760, audioCtx.currentTime + 0.1, 0.2, 'sine'); }
      else if(type === 'milestone') { createOscillator(523, audioCtx.currentTime, 0.2, 'triangle'); createOscillator(659, audioCtx.currentTime + 0.1, 0.2, 'triangle'); }
      else if(type === 'smash') { createOscillator(150, audioCtx.currentTime, 0.1, 'sawtooth'); }
  }

  function stopBGM() { if (window.bgmInterval) clearInterval(window.bgmInterval); }
  
  soundBtn.addEventListener('click', (e) => { 
      e.stopPropagation(); isMuted = !isMuted; 
      soundBtn.innerText = isMuted ? "🔇" : "🔊"; 
      if(isMuted) stopBGM(); else if(isRunning) playBGM(); 
  });

  // --- UI 및 상점 ---
  function updateCoinUI() {
      userCoinsEl.innerText = totalCoins;
      startCoinsEl.innerText = totalCoins;
      shopCoinsEl.innerText = totalCoins;
      localStorage.setItem('runnerCoins', totalCoins);
  }

  function updatePlayerImage() { 
      if (myChar.type === 'image') {
          player.innerHTML = `<img src="${myChar.val}" alt="Char">`;
          player.classList.remove('emoji-char');
      } else {
          player.innerHTML = myChar.val;
          player.classList.add('emoji-char');
      }
  }

  function selectBg(className, element) {
      document.body.className = className;
      document.querySelectorAll('#bgOptions .chip').forEach(opt => opt.classList.remove('selected'));
      element.classList.add('selected');
  }

  function openShop() { startOverlay.classList.add('hidden'); shopOverlay.classList.remove('hidden'); }
  function closeShop() { shopOverlay.classList.add('hidden'); startOverlay.classList.remove('hidden'); renderCharOptions(); }

  function drawGacha() {
      if (totalCoins < 500) return alert("코인이 부족해요! (500 필요)");
      totalCoins -= 500; updateCoinUI();
      gachaBox.classList.add('shaking'); gachaResult.innerText = "두근두근...";
      
      setTimeout(() => {
          gachaBox.classList.remove('shaking');
          const gachaPool = SKIN_DB.filter(s => s.obtain === 'gacha');
          const picked = gachaPool[Math.floor(Math.random() * gachaPool.length)];
          let msg = "";
          if (ownedSkins.includes(picked.id)) {
              totalCoins += 300; updateCoinUI(); msg = `💥 중복! [${picked.name}] (300코인 환급)`;
          } else {
              ownedSkins.push(picked.id); localStorage.setItem('runnerSkins', JSON.stringify(ownedSkins)); msg = `🎉 [${picked.name}] 획득!`; playSound('milestone');
          }
          gachaResult.innerText = msg;
      }, 1000);
  }

  function renderCharOptions() {
      charOptions.innerHTML = "";
      SKIN_DB.forEach(skin => {
          const isOwned = ownedSkins.includes(skin.id);
          const el = document.createElement('div');
          el.className = `chip ${isOwned ? 'owned' : ''} ${myChar.val === skin.id ? 'selected' : ''}`;
          el.innerText = skin.name;
          if (!isOwned) el.style.opacity = "0.5";
          else el.onclick = () => selectChar(skin.id, skin.type);
          charOptions.appendChild(el);
      });
  }

  function selectChar(id, type) {
      myChar = { type: type, val: id }; renderCharOptions(); updatePlayerImage();
  }

  function checkHiddenUnlock() {
      if (best >= 1000 && !document.getElementById('bgSunset')) addBgOption('bg-sunset', '🔥 노을', 'bgSunset');
      // 🔄 오로라/심해 이름표 교체
      if (best >= 1500 && !document.getElementById('bgMidnight')) addBgOption('bg-aurora', '🌃 심해', 'bgMidnight'); 
      if (best >= 2000 && !document.getElementById('bgSpace')) addBgOption('bg-space', '🚀 우주', 'bgSpace');
      if (best >= 2500 && !document.getElementById('bgAurora')) addBgOption('bg-midnight', '🌈 오로라', 'bgAurora');
  }

  function addBgOption(cls, name, id) {
      const chip = document.createElement('div');
      chip.id = id; chip.className = 'chip bg-unlocked'; chip.innerText = name;
      chip.onclick = function() { selectBg(cls, this); };
      bgOptions.appendChild(chip);
  }

  function startGame() {
      initAudio(); playBGM();
      startOverlay.classList.add('hidden'); gameOverOverlay.classList.add('hidden'); shopOverlay.classList.add('hidden'); rankingOverlay.classList.add('hidden');
      isRunning = true; score = 0; gameSpeed = 7.5; frameCount = 0; obstacles = []; items = [];
      playerY = 0; velocityY = 0; jumpCount = 0; feverGauge = 0; isFever = false;
      document.querySelectorAll('.obstacle').forEach(e => e.remove());
      document.querySelectorAll('.item-star').forEach(e => e.remove());
      document.querySelectorAll('.float-text').forEach(e => e.remove());
      document.querySelectorAll('.trail').forEach(e => e.remove());
      player.classList.remove('dead'); player.classList.add('running');
      updateFeverUI();
      animationId = requestAnimationFrame(gameLoop);
  }

  function restartGame() { startGame(); }
  function backToSettings() {
      stopBGM(); gameOverOverlay.classList.add('hidden'); startOverlay.classList.remove('hidden');
      isRunning = false; cancelAnimationFrame(animationId); checkHiddenUnlock();
  }

  function jump() {
      if (!isRunning) return;
      if (jumpCount < 2) { 
          velocityY = jumpPower; 
          jumpCount++; 
          if(jumpCount === 2) { 
              player.classList.remove('spin');
              void player.offsetWidth; 
              player.classList.add('spin');
          }
      }
  }

  function updateFeverUI() {
      feverBar.style.width = feverGauge + '%';
      if(feverGauge >= 100) feverBar.classList.add('full'); else feverBar.classList.remove('full');
  }

  function createFloatText(x, y, text) {
      const el = document.createElement('div'); el.className = 'float-text'; el.innerText = text;
      el.style.left = x + 'px'; el.style.bottom = y + 'px';
      stage.appendChild(el); setTimeout(() => el.remove(), 800);
  }

  function createTrail() {
      const trail = document.createElement('div');
      trail.className = 'trail';
      trail.innerHTML = player.innerHTML;
      trail.style.left = player.style.left;
      trail.style.bottom = player.style.bottom;
      trail.style.transform = getComputedStyle(player).transform; 
      stage.appendChild(trail);
      setTimeout(() => { trail.style.opacity = 0; trail.style.transform += " scale(1.2)"; }, 50);
      setTimeout(() => trail.remove(), 300);
  }

  function gameLoop() {
      if (!isRunning) return;
      frameCount++;
      if (!isFever && gameSpeed < 25) gameSpeed += 0.0015;
      if (frameCount % 6 === 0) { score += (isFever ? 3 : 1); scoreEl.innerText = score; }

      if (isFever && frameCount % 4 === 0) createTrail();

      playerY += velocityY; velocityY -= gravity;
      
      // 🦶 착지 (Squash) 효과: 짧고 굵게
      if (playerY <= 0) { 
          if(velocityY < -5) { 
              player.classList.remove('landing'); 
              void player.offsetWidth; 
              player.classList.add('landing'); 
              setTimeout(() => { player.classList.remove('landing'); }, 150);

              const dust = document.createElement('div'); dust.className = 'dust';
              dust.style.left = '60px'; dust.style.bottom = '35px';
              stage.appendChild(dust); setTimeout(() => dust.remove(), 300);
          }
          playerY = 0; jumpCount = 0; 
      }
      player.style.bottom = (GROUND_HEIGHT + playerY) + "px";

      if (frameCount % Math.floor(150 - gameSpeed*2) === 0 || Math.random() < 0.005) createObstacle();
      if (frameCount % 200 === 0 && Math.random() < 0.5) createItem();

      moveObstacles(); moveItems();
      animationId = requestAnimationFrame(gameLoop);
  }

  function createObstacle() {
      const obs = document.createElement('div');
      obs.classList.add('obstacle');
      obs.innerText = Math.random() < 0.3 ? "🦅" : (Math.random() < 0.5 ? "🌵" : "🪨");
      if (obs.innerText === "🦅") obs.classList.add('bird');
      obs.xPos = stage.clientWidth + 50;
      obs.style.left = obs.xPos + "px";
      obs.style.bottom = (obs.innerText === "🦅" ? GROUND_HEIGHT + 40 : GROUND_HEIGHT) + "px";
      stage.appendChild(obs); obstacles.push(obs);
  }

  function createItem() {
      const item = document.createElement('div');
      item.className = 'item-star'; item.innerText = '⭐';
      item.xPos = stage.clientWidth + 50;
      item.style.left = item.xPos + 'px';
      item.style.bottom = (GROUND_HEIGHT + 50 + Math.random() * 50) + 'px';
      stage.appendChild(item); items.push(item);
  }

  function moveObstacles() {
      for (let i = obstacles.length - 1; i >= 0; i--) {
          let obs = obstacles[i];
          obs.xPos -= gameSpeed; obs.style.left = obs.xPos + "px";
          
          if (obs.xPos > 50 && obs.xPos < 90) { 
              const obsBottom = parseInt(obs.style.bottom);
              if (playerY < obsBottom + 30 && playerY + 50 > obsBottom + 10) {
                  if (isFever) {
                      obs.remove(); obstacles.splice(i, 1); score += 10; createFloatText(obs.xPos, obsBottom+50, "💥"); playSound('smash'); continue;
                  } else { gameOver(); return; }
              }
          }
          if (obs.xPos < -50) { obs.remove(); obstacles.splice(i, 1); }
      }
  }

  function moveItems() {
      for (let i = items.length - 1; i >= 0; i--) {
          let item = items[i];
          item.xPos -= gameSpeed; item.style.left = item.xPos + "px";
          if (item.xPos > 50 && item.xPos < 90) {
              const itemH = parseInt(item.style.bottom);
              if (playerY + GROUND_HEIGHT + 60 > itemH && playerY + GROUND_HEIGHT < itemH + 40) {
                  score += 50; createFloatText(70, itemH+20, "+50"); playSound('coin');
                  if (!isFever) { 
                      feverGauge = Math.min(feverGauge + 20, 100); updateFeverUI(); 
                      if (feverGauge >= 100) { isFever = true; document.body.classList.add('fever-mode'); setTimeout(() => { isFever = false; document.body.classList.remove('fever-mode'); feverGauge = 0; updateFeverUI(); }, 5000); }
                  }
                  item.remove(); items.splice(i, 1); continue;
              }
          }
          if (item.xPos < -50) { item.remove(); items.splice(i, 1); }
      }
  }

  function gameOver() {
      stopBGM();
      isRunning = false; cancelAnimationFrame(animationId);
      finalScoreEl.innerText = Math.floor(score);
      totalCoins += Math.floor(score);
      localStorage.setItem('runnerCoins', totalCoins);
      if (score > best) { best = score; localStorage.setItem('runnerBest', best); }
      updateCoinUI(); checkHiddenUnlock();
      
      const fortunes = ["🍀 소소한 행운!", "🌞 오늘은 대박 날!", "💖 사랑이 찾아올지도?", "💰 뜻밖의 용돈이?!"];
      const msg = fortunes[Math.floor(Math.random() * fortunes.length)];
      fortuneContainer.innerHTML = (score >= 1000) ? `<button class="btn-fortune" onclick="this.innerText='${msg}'">🥠 운세 뽑기</button>` : "<div style='color:#999; font-size:13px;'>🔒 1000점 이상 시 운세 잠금해제</div>";

      let newUnlocks = [];
      if (best >= UNLOCK_SCORE_DRAGON && !document.getElementById('hiddenDragon')) newUnlocks.push("용(🐲)");
      if (best >= UNLOCK_SCORE_TIGER && !document.getElementById('hiddenTiger')) newUnlocks.push("호랑이(🐯)");
      if (best >= BG_UNLOCK_AURORA && !document.getElementById('bgAurora')) newUnlocks.push("오로라 배경(🌈)");
      if (best >= BG_UNLOCK_SPACE && !document.getElementById('bgSpace')) newUnlocks.push("우주 배경(🚀)");
      
      if (newUnlocks.length > 0) {
          unlockMsg.innerHTML = `🎉 축하합니다! <b>${newUnlocks.join(", ")}</b> 해금 완료!`;
          unlockMsg.classList.remove('hidden');
          checkHiddenUnlock();
      } else {
          unlockMsg.classList.add('hidden');
      }

      gameOverOverlay.classList.remove('hidden');
  }

  // --- 랭킹 ---
  function openRanking() { gameOverOverlay.classList.add('hidden'); rankingOverlay.classList.remove('hidden'); loadRank(); }
  function closeRanking() { rankingOverlay.classList.add('hidden'); gameOverOverlay.classList.remove('hidden'); }
  
  function submitRank() {
      const name = nicknameInput.value.trim() || "익명";
      if (!confirm(`${name}님 ${Math.floor(score)}점을 등록하시겠습니까?`)) return;
      fetch(SCRIPT_URL, {
          method: 'POST', mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name, score: Math.floor(score) })
      }).then(() => { alert("등록 완료!"); loadRank(); });
  }

  function loadRank() {
      rankList.innerHTML = "<div style='text-align:center; padding:30px; color:#999;'>데이터를 불러오는 중...<br>(잠시만 기다려주세요)</div>";
      fetch(SCRIPT_URL).then(res => res.json()).then(data => {
          let html = "";
          if (data.length === 0) {
              html = "<div style='text-align:center; padding:20px;'>아직 등록된 랭킹이 없습니다.</div>";
          } else {
              data.slice(0, 10).forEach((item, idx) => {
                  let rankIcon = idx === 0 ? "🥇" : (idx === 1 ? "🥈" : (idx === 2 ? "🥉" : `${idx+1}위`));
                  html += `<div class="rank-item"><span>${rankIcon} ${item.name}</span><span>${item.score}</span></div>`;
              });
          }
          rankList.innerHTML = html;
      }).catch(() => rankList.innerHTML = "<div style='text-align:center; color:red; padding:20px;'>랭킹 로드 실패<br>(인터넷 연결 확인)</div>");
  }

  function shareScore() {
    const text = `🏃 Dopamine Runner\n[기록] ${Math.floor(score)}점\n도전해보세요! 👇\n🔗 ${window.location.href}`;
    if (navigator.share) { navigator.share({ title: 'Dopamine Runner', text: text, url: window.location.href }).catch(console.error); }
    else { navigator.clipboard.writeText(text).then(() => alert("링크가 복사되었습니다!")); }
  }

  window.addEventListener('keydown', (e) => { if (e.code === 'Space') { if(!isRunning) { if(!startOverlay.classList.contains('hidden')) startGame(); else if(!gameOverOverlay.classList.contains('hidden')) restartGame(); } else jump(); } });
  stage.addEventListener('touchstart', (e) => { if(e.target.closest('button') || e.target.closest('.chip')) return; e.preventDefault(); if(!isRunning) { if(!startOverlay.classList.contains('hidden')) startGame(); else if(!gameOverOverlay.classList.contains('hidden')) restartGame(); } else jump(); }, {passive:false});
  stage.addEventListener('mousedown', (e) => { if(e.target.closest('button') || e.target.closest('.chip')) return; if(isRunning) jump(); });

</script>
</body>
</html>
